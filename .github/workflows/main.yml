name: Mobile Automation CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Java 17
      # -------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # -------------------------------------------------
      # Node.js 20
      # -------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------------------------------
      # Android SDK
      # -------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------
      # Android PATH
      # -------------------------------------------------
      - name: Configure Android SDK PATH
        run: |
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # -------------------------------------------------
      # Install Linux dependencies for Android Emulator
      # -------------------------------------------------
      - name: Install Emulator Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libpulse0 \
            libpulse-mainloop-glib0 \
            libnss3 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libxtst6 \
            libasound2t64 \
            libgl1 \
            libglu1-mesa \
            libfontconfig1

          echo "===== PulseAudio ====="
          ldconfig -p | grep libpulse || true

      # -------------------------------------------------
      # Install Android SDK
      # -------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-35"
          sdkmanager "system-images;android-35;google_apis;x86_64"

          echo "===== Android versions ====="
          adb version
          emulator -version
          

      # -------------------------------------------------
      # Verify Emulator Dependencies
      # -------------------------------------------------
      - name: Verify Emulator Dependencies
        run: |
          echo "===== Emulator ====="
          which emulator

          echo "===== Emulator Version ====="
          emulator -version

          echo "===== QEMU Dependencies ====="
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" \
            | grep "not found" || true

      # -------------------------------------------------
      # Enable KVM
      # -------------------------------------------------
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          echo "===== KVM ====="
          ls -la /dev/kvm || true

      # -------------------------------------------------
      # Install Appium 2
      # -------------------------------------------------
      - name: Install Appium
        run: |
          npm install -g appium@3

          echo "===== APPIUM VERSION ====="
          appium --version

      # -------------------------------------------------
      # Install UiAutomator2
      # -------------------------------------------------
      - name: Install UiAutomator2
        run: |
          appium driver install uiautomator2

          echo "===== APPIUM DRIVERS ====="
          appium driver list --installed

      # -------------------------------------------------
      # Create Android Emulator
      # -------------------------------------------------
      - name: Create Android Emulator
        run: |
          echo "no" | avdmanager create avd \
            --name test-emulator \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo "===== AVAILABLE AVDs ====="
          emulator -list-avds

      # -------------------------------------------------
      # Start Android Emulator
      # -------------------------------------------------
      - name: Start Android Emulator
        timeout-minutes: 10
        run: |
          echo "Starting Android emulator..."

          adb start-server

          nohup emulator \
            -avd test-emulator \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            -accel on \
            > emulator.log 2>&1 &

          EMULATOR_PID=$!

          echo "Emulator PID: $EMULATOR_PID"

          echo "Waiting for emulator process..."

          sleep 10

          echo "===== EMULATOR PROCESS ====="
          ps -ef | grep '[e]mulator' || true

          echo "===== EMULATOR LOG ====="
          cat emulator.log || true

          echo "Waiting for ADB device..."

          for i in {1..60}; do

            echo "ADB attempt $i"

            adb devices -l

            if adb devices | grep -q "emulator-5554"; then
              echo "Emulator detected by ADB."
              break
            fi

            sleep 5
          done

          if ! adb devices | grep -q "emulator-5554"; then
            echo "ERROR: Emulator never appeared in ADB."

            echo "===== ADB ====="
            adb devices -l

            echo "===== EMULATOR LOG ====="
            cat emulator.log

            exit 1
          fi

          echo "Waiting for Android boot..."

          BOOT_COMPLETED=""

          for i in {1..120}; do

            BOOT_COMPLETED=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            echo "Boot attempt $i: $BOOT_COMPLETED"

            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "Android emulator boot completed."
              break
            fi

            sleep 2
          done

          if [ "$BOOT_COMPLETED" != "1" ]; then
            echo "ERROR: Android emulator did not finish booting."

            echo "===== ADB DEVICES ====="
            adb devices -l

            echo "===== EMULATOR LOG ====="
            cat emulator.log

            exit 1
          fi

      # -------------------------------------------------
      # Verify Android Emulator
      # -------------------------------------------------
      - name: Verify Android Emulator
        run: |
          echo "===== ADB DEVICES ====="
          adb devices -l

          echo "===== ADB STATE ====="
          adb get-state

          echo "===== MODEL ====="
          adb shell getprop ro.product.model

          echo "===== ANDROID VERSION ====="
          adb shell getprop ro.build.version.release

          echo "===== SDK VERSION ====="
          adb shell getprop ro.build.version.sdk

          echo "===== BOOT STATUS ====="
          adb shell getprop sys.boot_completed

      # -------------------------------------------------
      # Verify APK
      # -------------------------------------------------
      - name: Verify APK
        run: |
          APK="$GITHUB_WORKSPACE/src/main/resources/General-Store.apk"

          echo "===== APK ====="
          ls -lh "$APK"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK exists."

      # -------------------------------------------------
      # Start Appium Server
      # -------------------------------------------------
      - name: Start Appium Server
        run: |
          echo "Starting Appium server..."

          nohup appium \
            --address 127.0.0.1 \
            --port 4723 \
            --log-level debug \
            > appium.log 2>&1 &

          APPIUM_PID=$!

          echo "Appium PID: $APPIUM_PID"

          APPIUM_READY=false

          for i in {1..30}; do

            if curl -sf http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium is READY"
              APPIUM_READY=true
              break
            fi

            echo "Waiting for Appium... $i"

            sleep 2
          done

          if [ "$APPIUM_READY" != "true" ]; then
            echo "ERROR: Appium failed to start."

            echo "===== APPIUM LOG ====="
            cat appium.log

            exit 1
          fi

          echo "===== APPIUM STATUS ====="
          curl -v http://127.0.0.1:4723/status

      # -------------------------------------------------
      # Verify Before Maven
      # -------------------------------------------------
      - name: Verify Mobile Automation Environment
        run: |
          echo "========================================"
          echo "MOBILE AUTOMATION ENVIRONMENT"
          echo "========================================"

          echo "===== JAVA ====="
          java -version

          echo "===== NODE ====="
          node --version

          echo "===== APPIUM ====="
          appium --version

          echo "===== ADB ====="
          adb devices -l

          echo "===== BOOT ====="
          adb shell getprop sys.boot_completed

          echo "===== APPIUM ====="
          curl -sf http://127.0.0.1:4723/status

          echo "===== APK ====="
          ls -lh "$GITHUB_WORKSPACE/src/main/resources/General-Store.apk"

      # -------------------------------------------------
      # Run Maven Tests
      # -------------------------------------------------
      - name: Run Maven tests
        env:
          ANDROID_DEVICE_NAME: test-emulator
          APPIUM_SERVER_URL: http://127.0.0.1:4723
          APPIUM_HOST: 127.0.0.1
          APPIUM_PORT: 4723
        run: |
          mvn clean test -e

      # -------------------------------------------------
      # Show Appium Log
      # -------------------------------------------------
      - name: Show Appium Log
        if: always()
        run: |
          echo "========================================"
          echo "APPIUM LOG"
          echo "========================================"

          if [ -f appium.log ]; then
            cat appium.log
          else
            echo "appium.log was not found."
          fi

      # -------------------------------------------------
      # Show Emulator Log
      # -------------------------------------------------
      - name: Show Emulator Log
        if: always()
        run: |
          echo "========================================"
          echo "EMULATOR LOG"
          echo "========================================"

          if [ -f emulator.log ]; then
            cat emulator.log
          else
            echo "emulator.log was not found."
          fi

      # -------------------------------------------------
      # Show Surefire Reports
      # -------------------------------------------------
      - name: Show Surefire Reports
        if: always()
        run: |
          echo "========================================"
          echo "SUREFIRE REPORTS"
          echo "========================================"

          if [ -d target/surefire-reports ]; then
            find target/surefire-reports -type f -maxdepth 2 -print
          else
            echo "Surefire reports directory was not found."
          fi

      # -------------------------------------------------
      # Upload Results
      # -------------------------------------------------
      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-automation-results
          path: |
            emulator.log
            appium.log
            target/surefire-reports/
          if-no-files-found: warn