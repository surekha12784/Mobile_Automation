name: Mobile Automation CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Java 17
      # -------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # -------------------------------------------------
      # Node.js
      # -------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------------------------------
      # Android SDK
      # -------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------
      # Install Android SDK packages
      # -------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-35"
          sdkmanager "system-images;android-35;google_apis;x86_64"

      # -------------------------------------------------
      # Enable KVM
      # -------------------------------------------------
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          echo "===== KVM ====="
          ls -la /dev/kvm || true

      # -------------------------------------------------
      # Install Appium
      # -------------------------------------------------
      - name: Install Appium
        run: |
          npm install -g appium@3

          echo "===== APPIUM VERSION ====="
          appium --version

      # -------------------------------------------------
      # Install UiAutomator2
      # -------------------------------------------------
      - name: Install UiAutomator2
        run: |
          appium driver install uiautomator2

          echo "===== APPIUM DRIVERS ====="
          appium driver list --installed

      # -------------------------------------------------
      # Create Android Emulator
      # -------------------------------------------------
      - name: Create Android Emulator
        run: |
          echo "no" | avdmanager create avd \
            --name test-emulator \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo "===== AVAILABLE AVDs ====="
          emulator -list-avds

      # -------------------------------------------------
      # Start Android Emulator
      # -------------------------------------------------
      - name: Start Android Emulator
        timeout-minutes: 10
        run: |
          echo "Starting Android emulator..."

          nohup emulator \
            -avd test-emulator \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-metrics \
            > emulator.log 2>&1 &

          adb wait-for-device

          echo "ADB device detected."

          BOOT_COMPLETED=""

          for i in {1..120}; do

            BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            echo "Attempt $i - Boot status: $BOOT_COMPLETED"

            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "Android emulator boot completed."
              break
            fi

            sleep 2
          done

          if [ "$BOOT_COMPLETED" != "1" ]; then
            echo "Android emulator failed to boot."

            echo "===== ADB DEVICES ====="
            adb devices

            echo "===== EMULATOR LOG ====="
            cat emulator.log

            exit 1
          fi

      # -------------------------------------------------
      # Verify Android Emulator
      # -------------------------------------------------
      - name: Verify Android Emulator
        run: |
          echo "===== ADB DEVICES ====="
          adb devices -l

          echo "===== ADB STATE ====="
          adb get-state

          echo "===== MODEL ====="
          adb shell getprop ro.product.model

          echo "===== ANDROID VERSION ====="
          adb shell getprop ro.build.version.release

          echo "===== SDK VERSION ====="
          adb shell getprop ro.build.version.sdk

          echo "===== BOOT STATUS ====="
          adb shell getprop sys.boot_completed

      # -------------------------------------------------
      # Verify APK
      # -------------------------------------------------
      - name: Verify APK
        run: |
          echo "===== APK ====="
          ls -lh src/main/resources/General-Store.apk

          echo "===== APK FILE SEARCH ====="
          find . -name "*.apk" -type f -print

      # -------------------------------------------------
      # Start Appium Server
      # -------------------------------------------------
      - name: Start Appium Server
        run: |
          echo "Starting Appium server..."

          nohup appium \
            --address 127.0.0.1 \
            --port 4723 \
            --log-level debug \
            > appium.log 2>&1 &

          APPIUM_PID=$!

          echo "Appium PID: $APPIUM_PID"

          APPIUM_READY=false

          for i in {1..30}; do

            if curl -sf http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium is READY"
              APPIUM_READY=true
              break
            fi

            echo "Waiting for Appium... $i"
            sleep 2
          done

          if [ "$APPIUM_READY" != "true" ]; then
            echo "Appium failed to start."

            cat appium.log

            exit 1
          fi

          echo "===== APPIUM STATUS ====="
          curl -v http://127.0.0.1:4723/status

      # -------------------------------------------------
      # Verify Appium Before Session
      # -------------------------------------------------
      - name: Verify Appium Before Session
        run: |
          echo "========================================"
          echo "CHECKING APPIUM"
          echo "========================================"

          echo "===== APPIUM PROCESS ====="
          ps aux | grep '[a]ppium' || true

          echo "===== PORT 4723 ====="
          ss -lntp | grep 4723 || true

          echo "===== APPIUM STATUS ====="
          curl -v http://127.0.0.1:4723/status

          echo "===== ADB DEVICES ====="
          adb devices -l

          echo "===== ADB STATE ====="
          adb get-state

          echo "===== BOOT STATUS ====="
          adb shell getprop sys.boot_completed

          echo "===== APPIUM LOG ====="
          cat appium.log

      # -------------------------------------------------
      # DIRECT APPIUM SESSION TEST
      # -------------------------------------------------
      - name: Direct Appium Session Test
        run: |
          echo "========================================"
          echo "DIRECT APPIUM SESSION TEST"
          echo "========================================"

          echo "===== APPIUM STATUS ====="
          curl -v http://127.0.0.1:4723/status

          echo ""
          echo "===== ADB DEVICES ====="
          adb devices -l

          echo ""
          echo "===== ADB STATE ====="
          adb get-state

          echo ""
          echo "===== BOOT STATUS ====="
          adb shell getprop sys.boot_completed

          echo ""
          echo "===== APK ====="
          ls -lh src/main/resources/General-Store.apk

          echo ""
          echo "===== POST /SESSION ====="

          curl -v \
            -X POST \
            http://127.0.0.1:4723/session \
            -H "Content-Type: application/json" \
            --data-raw '{
              "capabilities": {
                "alwaysMatch": {
                  "platformName": "Android",
                  "appium:automationName": "UiAutomator2",
                  "appium:deviceName": "test-emulator",
                  "appium:udid": "emulator-5554",
                  "appium:app": "/home/runner/work/Mobile_Automation/Mobile_Automation/src/main/resources/General-Store.apk"
                },
                "firstMatch": [
                  {}
                ]
              }
            }'

      # -------------------------------------------------
      # Run Maven Tests
      # -------------------------------------------------
      - name: Run Maven tests
        env:
          ANDROID_DEVICE_NAME: test-emulator
          APPIUM_SERVER_URL: http://127.0.0.1:4723
        run: |
          mvn clean test -e

      # -------------------------------------------------
      # Show Appium Log
      # -------------------------------------------------
      - name: Show Appium Log
        if: always()
        run: |
          echo "========================================"
          echo "APPIUM LOG"
          echo "========================================"

          if [ -f appium.log ]; then
            cat appium.log
          else
            echo "appium.log was not found."
          fi

      # -------------------------------------------------
      # Show Emulator Log
      # -------------------------------------------------
      - name: Show Emulator Log
        if: always()
        run: |
          echo "========================================"
          echo "EMULATOR LOG"
          echo "========================================"

          if [ -f emulator.log ]; then
            cat emulator.log
          else
            echo "emulator.log was not found."
          fi

      # -------------------------------------------------
      # Show Surefire Reports
      # -------------------------------------------------
      - name: Show Surefire Reports
        if: always()
        run: |
          echo "========================================"
          echo "SUREFIRE REPORTS"
          echo "========================================"

          if [ -d target/surefire-reports ]; then
            find target/surefire-reports -type f -maxdepth 2 -print
          else
            echo "Surefire reports directory was not found."
          fi

      # -------------------------------------------------
      # Upload Logs
      # -------------------------------------------------
      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-automation-results
          path: |
            emulator.log
            appium.log
            target/surefire-reports/
          if-no-files-found: warn