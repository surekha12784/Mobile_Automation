name: Mobile Automation CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Java
      # -------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # -------------------------------------------------
      # Node
      # -------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------------------------------
      # Android SDK
      # -------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------
      # Android packages
      # -------------------------------------------------
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-35"
          sdkmanager "system-images;android-35;google_apis;x86_64"

      # -------------------------------------------------
      # Enable KVM
      # -------------------------------------------------
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # -------------------------------------------------
      # Install Appium
      # -------------------------------------------------
      - name: Install Appium
        run: |
          npm install -g appium@latest
          appium --version

      # -------------------------------------------------
      # Install UiAutomator2
      # -------------------------------------------------
      - name: Install UiAutomator2
        run: |
          appium driver install uiautomator2
          appium driver list --installed

      # -------------------------------------------------
      # Create emulator
      # -------------------------------------------------
      - name: Create Android Emulator
        run: |
          echo "no" | avdmanager create avd \
            --name test-emulator \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo "Available AVDs:"
          emulator -list-avds

      # -------------------------------------------------
      # Start emulator
      # -------------------------------------------------
      - name: Start Android Emulator
        timeout-minutes: 10
        run: |
          echo "Starting Android emulator..."

          nohup emulator \
            -avd test-emulator \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-metrics \
            > emulator.log 2>&1 &

          echo "Waiting for ADB..."

          adb wait-for-device

          echo "ADB device detected"

          for i in {1..120}; do
            BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            echo "Boot status: $BOOT_COMPLETED"

            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "Android emulator boot completed"
              break
            fi

            sleep 2
          done

          echo "===== DEVICES ====="
          adb devices

          echo "===== DEVICE STATE ====="
          adb get-state

          echo "===== BOOT COMPLETED ====="
          adb shell getprop sys.boot_completed

      # -------------------------------------------------
      # Verify emulator
      # -------------------------------------------------
      - name: Verify Android Emulator
        run: |
          echo "===== ADB DEVICES ====="
          adb devices

          echo "===== ADB STATE ====="
          adb get-state

          echo "===== MODEL ====="
          adb shell getprop ro.product.model

          echo "===== SDK ====="
          adb shell getprop ro.build.version.sdk

          echo "===== BOOT STATUS ====="
          adb shell getprop sys.boot_completed

      # -------------------------------------------------
      # Start Appium
      # -------------------------------------------------
      - name: Start Appium Server
        run: |
          echo "Starting Appium server..."

          nohup appium \
            --address 127.0.0.1 \
            --port 4723 \
            > appium.log 2>&1 &

          echo "Waiting for Appium..."

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium is READY"
              break
            fi

            echo "Waiting for Appium..."
            sleep 2
          done

          echo "===== APPIUM STATUS ====="
          curl -v http://127.0.0.1:4723/status

      # -------------------------------------------------
      # Final Android and Appium check
      # -------------------------------------------------
      - name: Final Android and Appium check
        run: |
          echo "===== ADB DEVICES ====="
          adb devices

          echo "===== ADB STATE ====="
          adb get-state

          echo "===== BOOT STATUS ====="
          adb shell getprop sys.boot_completed

          echo "===== APPIUM STATUS ====="
          curl -v http://127.0.0.1:4723/status

          echo "===== APK ====="
          ls -lh src/main/resources/General-Store.apk

          echo "===== APK FILE SEARCH ====="
          find . -name "*.apk" -type f -print

          echo "===== APPIUM LOG ====="
          cat appium.log

      # -------------------------------------------------
      # Run Maven tests
      # -------------------------------------------------
      - name: Run Maven tests
        env:
          ANDROID_DEVICE_NAME: test-emulator
          APPIUM_SERVER_URL: http://127.0.0.1:4723
        run: |
          mvn clean test

      # -------------------------------------------------
      # Upload logs
      # -------------------------------------------------
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-automation-results
          path: |
            emulator.log
            appium.log
            target/surefire-reports/