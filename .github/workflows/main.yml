name: Mobile Automation CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Java 17
      # -------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # -------------------------------------------------
      # Node.js 20
      # -------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------------------------------
      # Android SDK
      # -------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------
      # Android PATH
      # -------------------------------------------------
      - name: Configure Android SDK PATH
        run: |
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # -------------------------------------------------
      # Install Android SDK
      # -------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "emulator"
          sdkmanager "platforms;android-35"
          sdkmanager "system-images;android-35;google_apis;x86_64"

          echo "===== Android versions ====="
          adb version
          emulator -version
          avdmanager --version

      # -------------------------------------------------
      # Enable KVM
      # -------------------------------------------------
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -la /dev/kvm || true

      # -------------------------------------------------
      # Install Appium 2
      # -------------------------------------------------
      - name: Install Appium
        run: |
          npm install -g appium@2.12.1

          echo "===== APPIUM VERSION ====="
          appium --version

      # -------------------------------------------------
      # Install UiAutomator2
      # -------------------------------------------------
      - name: Install UiAutomator2
        run: |
          appium driver install uiautomator2

          echo "===== APPIUM DRIVERS ====="
          appium driver list --installed

      # -------------------------------------------------
      # Create Android Emulator
      # -------------------------------------------------
      - name: Create Android Emulator
        run: |
          echo "no" | avdmanager create avd \
            --name test-emulator \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo "===== AVAILABLE AVDs ====="
          emulator -list-avds

      # -------------------------------------------------
      # Start Android Emulator
      # -------------------------------------------------
      - name: Start Android Emulator
        timeout-minutes: 10
        run: |
          nohup emulator \
            -avd test-emulator \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-metrics \
            > emulator.log 2>&1 &

          adb wait-for-device

          for i in {1..120}; do
            BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            echo "Attempt $i - Boot status: $BOOT_COMPLETED"

            if [ "$BOOT_COMPLETED" = "1" ]; then
              echo "Android emulator boot completed."
              break
            fi

            sleep 2
          done

          if [ "$BOOT_COMPLETED" != "1" ]; then
            echo "Android emulator failed to boot."
            adb devices
            cat emulator.log
            exit 1
          fi

      # -------------------------------------------------
      # Verify Emulator
      # -------------------------------------------------
      - name: Verify Android Emulator
        run: |
          adb devices -l
          adb get-state
          adb shell getprop ro.product.model
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk

      # -------------------------------------------------
      # Verify APK
      # -------------------------------------------------
      - name: Verify APK
        run: |
          ls -lh "$GITHUB_WORKSPACE/src/main/resources/General-Store.apk"

      # -------------------------------------------------
      # Start Appium
      # -------------------------------------------------
      - name: Start Appium Server
        run: |
          nohup appium \
            --address 127.0.0.1 \
            --port 4723 \
            --log-level debug \
            > appium.log 2>&1 &

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium is READY"
              break
            fi

            echo "Waiting for Appium... $i"
            sleep 2
          done

          curl -v http://127.0.0.1:4723/status

      # -------------------------------------------------
      # Run Maven Tests
      # -------------------------------------------------
      - name: Run Maven tests
        env:
          ANDROID_DEVICE_NAME: test-emulator
          APPIUM_SERVER_URL: http://127.0.0.1:4723
        run: |
          mvn clean test -e

      # -------------------------------------------------
      # Logs
      # -------------------------------------------------
      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-automation-results
          path: |
            emulator.log
            appium.log
            target/surefire-reports/
          if-no-files-found: warn